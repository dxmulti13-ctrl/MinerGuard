
name: Build MinerGuard for Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MinerGuard --collect-all psutil src\minerguard.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MinerGuard-Windows
          path: dist/MinerGuard.exe
